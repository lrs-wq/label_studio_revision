# Label Studio reverse proxy only.
# This config intentionally does not expose Label Studio media/upload
# directories as static files, so application permissions stay in Label Studio.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream label_studio_app {
    server 127.0.0.1:8090;
    keepalive 32;
}

server {
    listen 80;
    server_name 39.106.120.253;

    client_max_body_size 20G;
    gzip off;

    location / {
        proxy_pass http://label_studio_app;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
