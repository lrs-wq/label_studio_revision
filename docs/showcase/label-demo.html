<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Label Studio · 标注流程示意</title><style>*{box-sizing:border-box}body{margin:0;color:#233246;background:#edf1f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:28px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:28px;margin:0 0 8px}p{color:#5e6c7c;line-height:1.65;margin:6px 0}.badge{border:1px solid #cdd7e2;background:white;border-radius:30px;padding:8px 16px;font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{background:white;border:1px solid #d8e1e9;border-radius:14px;padding:22px}h2{font-size:17px;margin:0 0 16px}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}button{background:#255c87;border:0;border-radius:7px;color:white;padding:11px 17px;font:inherit;font-size:14px;cursor:pointer}button:hover{background:#174666}button:focus-visible{outline:3px solid #86b8e3;outline-offset:3px}button.secondary{background:#e8eef4;color:#25455e}pre{white-space:pre-wrap;background:#f2f5f8;color:#274259;padding:18px;border-radius:9px;font:13px/1.6 ui-monospace,Menlo,monospace;min-height:230px}svg{width:100%;height:auto;display:block}.note{font-size:13px;border-top:1px solid #dce4ec;margin-top:22px;padding-top:12px}.status{font-size:17px;color:#255c87;font-weight:650;min-height:28px}@media(max-width:780px){.layout{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:8px}}</style></head><body><main>
<header><div><h1>猫狗姿态标注 · 交互导览</h1><p>体验关键点、可见性与 YOLO Pose 数据之间的关系。</p></div><span class="badge">离线示意 · 无模型 / 无数据库</span></header>
<div class="layout"><section class="panel"><h2>17 个关键点 · 点击圆点切换可见 / 遮挡</h2>
<svg viewBox="0 0 600 390" aria-label="带17个姿态关键点的猫轮廓示意"><rect width="600" height="390" rx="12" fill="#f4f1ea"/>
<path d="M440 190C520 130 542 72 512 52" fill="none" stroke="#baaf9d" stroke-width="24" stroke-linecap="round"/>
<ellipse cx="326" cy="204" rx="141" ry="75" fill="#d5cbba"/>
<path d="M224 240L208 330 181 330 188 237M266 248L272 336 246 336 237 241M401 236L436 324 409 328 371 252M358 246L366 328 338 330 326 250" fill="#c0b49f"/>
<path d="M119 134L111 76 163 109 211 90 213 151Q235 217 180 236Q127 239 104 191Z" fill="#d5cbba"/>
<circle cx="139" cy="165" r="5" fill="#514e47"/><circle cx="188" cy="162" r="5" fill="#514e47"/><path d="M152 190h17l-8 8z" fill="#867d70"/>
<g id="bones" stroke="#49758b" stroke-width="3" opacity=".65"></g><g id="points"></g>
<text x="18" y="370" font-size="14" fill="#736e64">几何轮廓与坐标为合成示例；左右以动物自身为准。</text></svg>
<div class="controls"><button id="pre">1 · 预标注</button><button id="review">2 · 校对遮挡</button><button id="export">3 · 查看导出</button></div>
<p id="stage" class="status" aria-live="polite">选择“预标注”开始</p></section>
<section class="panel"><h2>可见性与数据</h2><p>0：未标注 / 不可见　1：遮挡但可推断　2：可见</p><p id="selection">示意点位沿用本仓库猫姿态的 17 点顺序。</p><pre id="payload">预标注后展示坐标；校对后查看导出。

实际项目中：
模型输出 → 人工核对 → 导出 YOLO Pose

本页不运行 Label Studio 或 YOLO。</pre><p class="note">实际界面与后端请按 README 部署。原图、标注数据库、模型权重均未包含在此演示中。</p></section></div></main>
<script>
const labels=['鼻尖','左眼','右眼','颈背','尾根','左前肩','左前肘','左前爪','右前肩','右前肘','右前爪','左后髋','左后膝','左后爪','右后髋','右后膝','右后爪'];
const coords=[[161,195],[139,165],[188,162],[225,154],[442,191],[235,202],[251,262],[259,329],[202,205],[196,264],[194,323],[360,198],[351,264],[352,322],[406,204],[410,265],[423,321]];
let active=false;let visibility=Array(17).fill(2);
const edges=[[0,1],[0,2],[0,3],[3,4],[3,5],[5,6],[6,7],[3,8],[8,9],[9,10],[4,11],[11,12],[12,13],[4,14],[14,15],[15,16]];
const stage=document.getElementById('stage'), payload=document.getElementById('payload');
function draw(){document.getElementById('bones').innerHTML=edges.map(([a,b])=>`<line x1="${coords[a][0]}" y1="${coords[a][1]}" x2="${coords[b][0]}" y2="${coords[b][1]}"/>`).join('');document.getElementById('points').innerHTML=coords.map(([x,y],i)=>`<circle tabindex="0" role="button" aria-label="${labels[i]}，可见性${visibility[i]}" data-i="${i}" cx="${x}" cy="${y}" r="7" fill="${visibility[i]===1?'#d79036':'#2a7d72'}" stroke="white" stroke-width="2"><title>${i+1}. ${labels[i]}</title></circle>`).join('');}
function show(){payload.textContent='// 合成示例 · 共 17 点，预览前 5 点\n// [x, y, visibility]，坐标已归一化\n\n'+coords.slice(0,5).map(([x,y],i)=>labels[i]+'  '+JSON.stringify([+(x/600).toFixed(4),+(y/390).toFixed(4),visibility[i]])).join('\n')+'\n\n左右以动物自身为准。';}
document.getElementById('pre').onclick=()=>{active=true;visibility.fill(2);draw();show();stage.textContent='预标注示意：17 个点已就位，等待人工核对';};
document.getElementById('review').onclick=()=>{if(!active)document.getElementById('pre').click();visibility[2]=1;draw();show();document.getElementById('selection').textContent='示例：右眼设为 1（遮挡但可推断）；其余点保持可见。';stage.textContent='人工校对：橙色点标记遮挡';};
document.getElementById('export').onclick=()=>{if(!active)document.getElementById('pre').click();const tail=coords.flatMap(([x,y],i)=>[(x/600).toFixed(4),(y/390).toFixed(4),String(visibility[i])]);payload.textContent='# YOLO Pose 示例：类别 + 框中心/宽高 + 17组(x,y,v)\n# 坐标已归一化；框为覆盖全部示意点的合成框\n0 0.4842 0.6192 0.5050 0.5179 '+tail.join(' ');stage.textContent='导出示意：17 × 3 关键点字段，保持既定顺序';};
function toggle(e){const i=Number(e.target.dataset.i);if(!active||!Number.isInteger(i))return;visibility[i]=visibility[i]===2?1:2;draw();show();document.getElementById('selection').textContent=labels[i]+'：可见性 '+visibility[i];}
document.getElementById('points').addEventListener('click',toggle);document.getElementById('points').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(e);}});
</script></body></html>
